<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepolia File Registry</title>
  
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- CryptoJS for SHA-256 (works on HTTP and IP addresses) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;
    const API_BASE_URL = `${window.location.origin}/api`;

    function FileHasher() {
      const [selectedFile, setSelectedFile] = useState(null);
      const [fileName, setFileName] = useState('');
      const [hashResult, setHashResult] = useState(null);
      const [txData, setTxData] = useState(null);
      const [history, setHistory] = useState([]);
      const [statusMessage, setStatusMessage] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      
      const fileInputRef = useRef(null);

      const handleBrowseClick = () => {
        fileInputRef.current.click();
      };

      const handleFileChange = (event) => {
        const file = event.target.files[0];
        if (file) {
          setSelectedFile(file);
          setFileName(file.name);
          setHashResult(null); 
          setTxData(null);
          setHistory([]);
          setStatusMessage('');
        }
      };

      const handleSubmitAndRecord = async () => {
        if (!selectedFile) return;

        setIsProcessing(true);
        setStatusMessage('Calculating SHA-256 hash...');

        try {
          // 1. Calculate SHA-256 using CryptoJS (compatible with plain HTTP)
          const arrayBuffer = await selectedFile.arrayBuffer();
          const wordArray = CryptoJS.lib.WordArray.create(arrayBuffer);
          const hashHex = CryptoJS.SHA256(wordArray).toString(CryptoJS.enc.Hex);
          setHashResult(hashHex);

          // 2. Submit to Node.js backend
          setStatusMessage('Submitting transaction to Sepolia blockchain...');
          const response = await fetch(`${API_BASE_URL}/records`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fileName: selectedFile.name,
              sha256Hash: hashHex
            })
          });

          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Failed to submit transaction');

          setTxData(data);
          setStatusMessage('Record successfully written to blockchain!');

          // 3. Fetch past records for this filename
          fetchHistory(selectedFile.name);
        } catch (error) {
          console.error("Error:", error);
          setStatusMessage(`Error: ${error.message}`);
        } finally {
          setIsProcessing(false);
        }
      };

      const fetchHistory = async (name) => {
        try {
          const res = await fetch(`${API_BASE_URL}/records/${encodeURIComponent(name)}`);
          const data = await res.json();
          if (data.success) {
            setHistory(data.records);
          }
        } catch (err) {
          console.error("Error fetching history:", err);
        }
      };

      const styles = {
        container: { maxWidth: '650px', margin: '2rem auto', padding: '0 1rem', fontFamily: 'system-ui, sans-serif' },
        formGroup: { display: 'flex', gap: '0.5rem', marginBottom: '1rem', alignItems: 'center' },
        textInput: { flexGrow: 1, padding: '0.5rem', fontSize: '1rem', borderRadius: '4px', border: '1px solid #ccc', backgroundColor: '#f5f5f5' },
        button: { padding: '0.5rem 1rem', fontSize: '1rem', cursor: 'pointer', backgroundColor: '#007bff', color: 'white', border: 'none', borderRadius: '4px' },
        disabledButton: { backgroundColor: '#ccc', cursor: 'not-allowed' },
        resultArea: { marginTop: '1.5rem', padding: '1rem', backgroundColor: '#f8f9fa', borderLeft: '4px solid #28a745' },
        hashText: { fontFamily: 'monospace', wordBreak: 'break-all', color: '#d63384' },
        historyItem: { padding: '0.75rem', borderBottom: '1px solid #eee', fontSize: '0.9rem' }
      };

      return (
        <div style={styles.container}>
          <h2>Sepolia File Registry Hasher</h2>

          <input
            type="file"
            ref={fileInputRef}
            onChange={handleFileChange}
            style={{ display: 'none' }}
          />

          <div style={styles.formGroup}>
            <button onClick={handleBrowseClick} style={styles.button}>
              Browse...
            </button>
            <input
              type="text"
              readOnly
              value={fileName}
              placeholder="No file selected"
              style={styles.textInput}
            />
          </div>

          <div style={styles.formGroup}>
            <button
              onClick={handleSubmitAndRecord}
              disabled={!selectedFile || isProcessing}
              style={{ 
                ...styles.button, 
                ...(!selectedFile || isProcessing ? styles.disabledButton : {}) 
              }}
            >
              {isProcessing ? 'Processing...' : 'Hash & Record to Blockchain'}
            </button>
          </div>

          {statusMessage && <p><strong>Status:</strong> {statusMessage}</p>}

          {txData && (
            <div style={styles.resultArea}>
              <strong>Assigned Record ID:</strong> {txData.recordId}<br />
              <strong>UUID v4:</strong> {txData.uuid}<br />
              <strong>SHA-256:</strong> <span style={styles.hashText}>{txData.sha256Hash}</span><br />
              <strong>Transaction Hash:</strong>{' '}
              <a 
                href={`https://sepolia.etherscan.io/tx/${txData.txHash}`} 
                target="_blank" 
                rel="noreferrer"
                style={{ wordBreak: 'break-all' }}
              >
                {txData.txHash}
              </a>
            </div>
          )}

          {history.length > 0 && (
            <div style={{ marginTop: '2rem' }}>
              <h3>Blockchain History for "{fileName}"</h3>
              {history.map((rec, i) => (
                <div key={i} style={styles.historyItem}>
                  <div><strong>UUID:</strong> {rec.uuid}</div>
                  <div><strong>SHA-256:</strong> <span style={styles.hashText}>{rec.sha256Hash}</span></div>
                  <div><strong>Recorded By:</strong> {rec.recordedBy}</div>
                  <div><strong>Date:</strong> {rec.timestamp}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FileHasher />);
  </script>
</body>
</html>
