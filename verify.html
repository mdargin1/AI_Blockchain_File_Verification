<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepolia File Integrity Verifier</title>
  
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- CryptoJS for SHA-256 (HTTP & IP address compatible) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;
    const API_BASE_URL = `${window.location.origin}/api`;

    function FileVerifier() {
      const [selectedFile, setSelectedFile] = useState(null);
      const [fileName, setFileName] = useState('');
      const [localHash, setLocalHash] = useState('');
      const [verificationStatus, setVerificationStatus] = useState(null); // 'MATCH', 'MISMATCH', 'NOT_FOUND', or null
      const [records, setRecords] = useState([]);
      const [statusMessage, setStatusMessage] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);

      // AI Analysis State
      const [aiExplanation, setAiExplanation] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [aiError, setAiError] = useState('');
      
      const fileInputRef = useRef(null);

      const handleBrowseClick = () => {
        fileInputRef.current.click();
      };

      const handleFileChange = (event) => {
        const file = event.target.files[0];
        if (file) {
          setSelectedFile(file);
          setFileName(file.name);
          setLocalHash('');
          setVerificationStatus(null);
          setRecords([]);
          setStatusMessage('');
          setAiExplanation('');
          setAiError('');
        } else {
          setSelectedFile(null);
          setFileName('');
        }
      };

      const handleVerify = async () => {
        if (!selectedFile) return;

        setIsVerifying(true);
        setVerificationStatus(null);
        setAiExplanation('');
        setAiError('');
        setStatusMessage('Calculating SHA-256 hash...');

        try {
          // 1. Calculate local SHA-256 hash using CryptoJS
          const arrayBuffer = await selectedFile.arrayBuffer();
          const wordArray = CryptoJS.lib.WordArray.create(arrayBuffer);
          const computedHash = CryptoJS.SHA256(wordArray).toString(CryptoJS.enc.Hex).toLowerCase();
          setLocalHash(computedHash);

          // 2. Query blockchain records from backend
          setStatusMessage('Querying Sepolia blockchain for matching filename...');
          const response = await fetch(`${API_BASE_URL}/records/${encodeURIComponent(selectedFile.name)}`);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Failed to fetch records from server');
          }

          const onChainRecords = data.records || [];
          setRecords(onChainRecords);

          // 3. Evaluate verification status
          if (onChainRecords.length === 0) {
            setVerificationStatus('NOT_FOUND');
            setStatusMessage('Verification complete: File name not registered on chain.');
          } else {
            const latestRecord = onChainRecords[onChainRecords.length - 1];
            const isMatch = latestRecord.sha256Hash.toLowerCase() === computedHash;

            if (isMatch) {
              setVerificationStatus('MATCH');
              setStatusMessage('Verification complete: Integrity Verified (Hash Matches).');
            } else {
              setVerificationStatus('MISMATCH');
              setStatusMessage('Verification complete: Integrity Alert (Hash Mismatch).');
            }
          }
        } catch (error) {
          console.error("Verification error:", error);
          setStatusMessage(`Error: ${error.message}`);
        } finally {
          setIsVerifying(false);
        }
      };

      const handleExplainWithAI = async () => {
        setIsAiLoading(true);
        setAiError('');
        setAiExplanation('');

        try {
          const latestRecord = records.length > 0 ? records[records.length - 1] : null;
          
          const payload = {
            fileName: fileName,
            verificationStatus: verificationStatus === 'MATCH' ? 'Verified' : (verificationStatus === 'MISMATCH' ? 'Hash Mismatch' : 'Not Found'),
            hashMatch: verificationStatus === 'MATCH',
            timestamp: latestRecord ? latestRecord.timestamp : new Date().toISOString()
          };

          const response = await fetch(`${API_BASE_URL}/explain`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'AI analysis is temporarily unavailable. The blockchain verification results above remain valid.');
          }

          setAiExplanation(data.explanation);
        } catch (err) {
          console.error('AI Explanation Error:', err);
          setAiError(err.message || 'AI analysis is temporarily unavailable. The blockchain verification results above remain valid.');
        } finally {
          setIsAiLoading(false);
        }
      };

      const styles = {
        container: { maxWidth: '650px', margin: '2rem auto', padding: '0 1rem', fontFamily: 'system-ui, sans-serif' },
        formGroup: { display: 'flex', gap: '0.5rem', marginBottom: '1rem', alignItems: 'center' },
        textInput: { flexGrow: 1, padding: '0.5rem', fontSize: '1rem', borderRadius: '4px', border: '1px solid #ccc', backgroundColor: '#f5f5f5' },
        button: { padding: '0.5rem 1rem', fontSize: '1rem', cursor: 'pointer', backgroundColor: '#0d6efd', color: 'white', border: 'none', borderRadius: '4px' },
        aiButton: { padding: '0.6rem 1.2rem', fontSize: '1rem', cursor: 'pointer', backgroundColor: '#6f42c1', color: 'white', border: 'none', borderRadius: '4px', marginTop: '1rem' },
        disabledButton: { backgroundColor: '#ccc', cursor: 'not-allowed' },
        hashText: { fontFamily: 'monospace', wordBreak: 'break-all', fontSize: '0.9rem' },
        badgeMatch: { backgroundColor: '#d1e7dd', color: '#0f5132', border: '1px solid #badbcc', padding: '1rem', borderRadius: '6px', marginTop: '1.5rem' },
        badgeMismatch: { backgroundColor: '#f8d7da', color: '#842029', border: '1px solid #f5c2c7', padding: '1rem', borderRadius: '6px', marginTop: '1.5rem' },
        badgeNotFound: { backgroundColor: '#fff3cd', color: '#664d03', border: '1px solid #ffecb5', padding: '1rem', borderRadius: '6px', marginTop: '1.5rem' },
        aiCard: { backgroundColor: '#f3e8ff', border: '1px solid #d8b4fe', borderRadius: '6px', padding: '1rem', marginTop: '1rem', color: '#3b0764' },
        aiErrorBox: { backgroundColor: '#fff3cd', border: '1px solid #ffecb5', color: '#664d03', padding: '0.75rem', borderRadius: '4px', marginTop: '1rem', fontSize: '0.9rem' },
        recordCard: { backgroundColor: '#f8f9fa', border: '1px solid #dee2e6', borderRadius: '4px', padding: '0.75rem', marginTop: '0.5rem', fontSize: '0.85rem' }
      };

      return (
        <div style={styles.container}>
          <h2>Sepolia File Integrity Verifier</h2>

          <input
            type="file"
            ref={fileInputRef}
            onChange={handleFileChange}
            style={{ display: 'none' }}
          />

          <div style={styles.formGroup}>
            <button onClick={handleBrowseClick} style={styles.button}>
              Browse...
            </button>
            <input
              type="text"
              readOnly
              value={fileName}
              placeholder="Select a file to verify"
              style={styles.textInput}
            />
          </div>

          <div style={styles.formGroup}>
            <button
              onClick={handleVerify}
              disabled={!selectedFile || isVerifying}
              style={{ 
                ...styles.button, 
                ...(!selectedFile || isVerifying ? styles.disabledButton : {}) 
              }}
            >
              {isVerifying ? 'Verifying...' : 'Verify on Blockchain'}
            </button>
          </div>

          {statusMessage && <p><strong>Status:</strong> {statusMessage}</p>}

          {localHash && (
            <div style={{ margin: '1rem 0' }}>
              <strong>Local Computed SHA-256:</strong>
              <div style={{ ...styles.hashText, color: '#333', background: '#eee', padding: '0.5rem', borderRadius: '4px' }}>
                {localHash}
              </div>
            </div>
          )}

          {/* Verification Status Banners */}
          {verificationStatus === 'MATCH' && (
            <div style={styles.badgeMatch}>
              <h3 style={{ margin: '0 0 0.5rem 0' }}>Verification Successful</h3>
              The file <strong>{fileName}</strong> was found on the Sepolia blockchain, and the calculated hash matches the on-chain record.
            </div>
          )}

          {verificationStatus === 'MISMATCH' && (
            <div style={styles.badgeMismatch}>
              <h3 style={{ margin: '0 0 0.5rem 0' }}>Hash Mismatch Warning</h3>
              The file name <strong>{fileName}</strong> exists on-chain, but the local hash does not match the latest blockchain record. The file may have been modified or corrupted.
            </div>
          )}

          {verificationStatus === 'NOT_FOUND' && (
            <div style={styles.badgeNotFound}>
              <h3 style={{ margin: '0 0 0.5rem 0' }}>Record Not Found</h3>
              No records for <strong>{fileName}</strong> were found on the Sepolia smart contract.
            </div>
          )}

          {/* AI Explanation Trigger and Results */}
          {verificationStatus && (
            <div>
              <button
                onClick={handleExplainWithAI}
                disabled={isAiLoading}
                style={{
                  ...styles.aiButton,
                  ...(isAiLoading ? styles.disabledButton : {})
                }}
              >
                {isAiLoading ? 'Analyzing Results with AI...' : 'Explain Results with AI'}
              </button>

              {aiError && (
                <div style={styles.aiErrorBox}>
                  {aiError}
                </div>
              )}

              {aiExplanation && (
                <div style={styles.aiCard}>
                  <h4 style={{ margin: '0 0 0.5rem 0', color: '#581c87' }}>AI Verification Analysis</h4>
                  <p style={{ margin: 0, lineHeight: 1.5 }}>{aiExplanation}</p>
                </div>
              )}
            </div>
          )}

          {/* On-Chain Records Details */}
          {records.length > 0 && (
            <div style={{ marginTop: '2rem' }}>
              <h3>On-Chain Records for "{fileName}" ({records.length})</h3>
              {records.map((rec, index) => {
                const doesHashMatch = rec.sha256Hash.toLowerCase() === localHash;
                return (
                  <div key={index} style={styles.recordCard}>
                    <div><strong>Version #{index + 1}</strong> | UUID: {rec.uuid}</div>
                    <div><strong>On-Chain Hash:</strong> <span style={styles.hashText}>{rec.sha256Hash}</span></div>
                    <div><strong>Hash Status:</strong> {doesHashMatch ? 'MATCHES SELECTED FILE' : 'DOES NOT MATCH'}</div>
                    <div><strong>Recorded By:</strong> {rec.recordedBy}</div>
                    <div><strong>Timestamp:</strong> {rec.timestamp}</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FileVerifier />);
  </script>
</body>
</html>
